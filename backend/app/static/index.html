<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatRAG</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/static/favicon/favicon-96x96.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000;
    --surface: #111;
    --surface-2: #1c1c1e;
    --surface-3: #2c2c2e;
    --border: rgba(255,255,255,0.1);
    --text: #fff;
    --text-2: #8e8e93;
    --text-3: #48484a;
    --accent: #0a84ff;
    --user-bubble: #0a84ff;
    --ai-bubble: #1c1c1e;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    --radius: 18px;
    --radius-sm: 10px;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }

  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

  /* Top bar */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 24px;
    border-bottom: 0.5px solid var(--border);
    backdrop-filter: blur(20px);
    background: rgba(0,0,0,0.8);
    position: sticky; top: 0; z-index: 10;
    flex-shrink: 0;
  }
  header img { width: 28px; height: 28px; border-radius: 7px; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  header span { font-size: 11px; color: var(--text-2); margin-left: 2px; }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #30d158; margin-left: auto;
    box-shadow: 0 0 6px #30d158aa;
  }

  /* Chat area */
  main {
    flex: 1; overflow-y: auto; padding: 24px 0;
    scroll-behavior: smooth;
  }
  main::-webkit-scrollbar { width: 4px; }
  main::-webkit-scrollbar-track { background: transparent; }
  main::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }

  .messages { max-width: 720px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }

  /* Empty state */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px;
    min-height: 60vh; color: var(--text-2);
  }
  .empty-state img { width: 52px; height: 52px; border-radius: 13px; opacity: 0.7; }
  .empty-state h2 { font-size: 20px; font-weight: 600; color: var(--text); }
  .empty-state p { font-size: 14px; color: var(--text-2); text-align: center; max-width: 300px; line-height: 1.5; }

  /* Message row */
  .msg { display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-items: flex-end; }
  .msg.ai { align-items: flex-start; }

  .bubble {
    max-width: 78%; padding: 12px 16px;
    font-size: 15px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-radius: var(--radius) var(--radius) 4px var(--radius);
  }
  .msg.ai .bubble {
    background: var(--ai-bubble);
    color: var(--text);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
    border: 0.5px solid var(--border);
  }

  /* Sources */
  .sources-toggle {
    font-size: 12px; color: var(--text-2);
    cursor: pointer; display: flex; align-items: center; gap: 4px;
    padding: 2px 0; user-select: none;
    background: none; border: none; color: var(--text-2);
  }
  .sources-toggle:hover { color: var(--text); }
  .sources-toggle svg { transition: transform 0.2s; }
  .sources-toggle.open svg { transform: rotate(180deg); }

  .sources-list {
    display: none; flex-direction: column; gap: 6px;
    max-width: 78%; margin-top: 4px;
  }
  .sources-list.open { display: flex; }

  .source-card {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px;
    font-size: 12px; color: var(--text-2); line-height: 1.5;
  }
  .source-card strong { color: var(--text-3); font-size: 11px; display: block; margin-bottom: 3px; }

  /* Typing indicator */
  .typing { display: flex; align-items: center; gap: 5px; padding: 14px 16px;
    background: var(--ai-bubble); border: 0.5px solid var(--border);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
    width: fit-content;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-2);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Input bar */
  footer {
    padding: 12px 20px 20px;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(20px);
    border-top: 0.5px solid var(--border);
    flex-shrink: 0;
  }
  .input-row {
    max-width: 720px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 22px; padding: 8px 8px 8px 18px;
    transition: border-color 0.2s;
  }
  .input-row:focus-within { border-color: rgba(255,255,255,0.25); }

  textarea {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: var(--font); font-size: 15px;
    line-height: 1.5; resize: none; max-height: 160px;
    overflow-y: auto; padding: 4px 0;
  }
  textarea::placeholder { color: var(--text-3); }
  textarea::-webkit-scrollbar { display: none; }

  .send-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: opacity 0.2s, transform 0.1s;
  }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .send-btn:not(:disabled):hover { opacity: 0.85; }
  .send-btn:not(:disabled):active { transform: scale(0.93); }
  .send-btn svg { width: 16px; height: 16px; fill: white; }

  .hint { text-align: center; font-size: 11px; color: var(--text-3); margin-top: 8px; }
</style>
</head>
<body>

<header>
  <img src="/static/favicon/favicon-96x96.png" alt="logo">
  <h1>ChatRAG</h1>
  <span>by aansensei</span>
  <div class="status-dot" title="Online"></div>
</header>

<main id="chat-area">
  <div class="messages" id="messages">
    <div class="empty-state" id="empty">
      <img src="/static/favicon/favicon-96x96.png" alt="logo">
      <h2>ChatRAG</h2>
      <p>Ask anything about your uploaded documents. I'll find the relevant context and answer.</p>
    </div>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="Ask a question..." maxlength="2000"></textarea>
    <button class="send-btn" id="send-btn" disabled>
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <p class="hint">Powered by Ollama · Supabase pgvector</p>
</footer>

<script>
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const messages = document.getElementById('messages');
const empty = document.getElementById('empty');
const chatArea = document.getElementById('chat-area');

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  sendBtn.disabled = !input.value.trim();
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

sendBtn.addEventListener('click', send);

function addMsg(role, text, sources) {
  if (empty) empty.style.display = 'none';
  const row = document.createElement('div');
  row.className = `msg ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);

  if (role === 'ai' && sources && sources.length) {
    const toggle = document.createElement('button');
    toggle.className = 'sources-toggle';
    toggle.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg> ${sources.length} source${sources.length > 1 ? 's' : ''}`;

    const list = document.createElement('div');
    list.className = 'sources-list';
    sources.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'source-card';
      card.innerHTML = `<strong>${s.section || `Source ${i+1}`} · ${(s.similarity * 100).toFixed(0)}% match</strong>${s.content}`;
      list.appendChild(card);
    });

    toggle.addEventListener('click', () => {
      toggle.classList.toggle('open');
      list.classList.toggle('open');
    });

    row.appendChild(toggle);
    row.appendChild(list);
  }

  messages.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
  return row;
}

function addTyping() {
  const row = document.createElement('div');
  row.className = 'msg ai';
  row.innerHTML = `<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  messages.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
  return row;
}

async function send() {
  const q = input.value.trim();
  if (!q) return;

  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  addMsg('user', q);
  const typing = addTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    const data = await res.json();
    typing.remove();
    addMsg('ai', data.answer, data.sources);
  } catch (err) {
    typing.remove();
    addMsg('ai', 'Something went wrong. Please try again.');
  }
}
</script>
</body>
</html>
