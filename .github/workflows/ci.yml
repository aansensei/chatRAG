name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # easyocr pulls in opencv-python (GUI build), which needs libGL on a
      # headless runner — without it, `import cv2` fails at test-collection time.
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r backend/requirements.txt
      # test_embedder.py downloads all-MiniLM-L6-v2 from the HF Hub at test time —
      # caching it means a transient huggingface.co outage (or network policy change)
      # doesn't fail CI once the cache is warm.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      # tests/*.py are standalone scripts (sys.exit-based), not pytest modules —
      # run each directly rather than via `pytest`, which fails on collection.
      # test_embedder.py downloads its model from the HF Hub on first use; retry a
      # few times since this occasionally fails with a transient connection error
      # on GitHub-hosted runners even with the cache step above warm.
      - run: |
          for f in backend/tests/test_*.py; do
            echo "::group::$f"
            for attempt in 1 2 3; do
              PYTHONPATH=backend python "$f" && break
              echo "attempt $attempt failed"
              if [ "$attempt" = "3" ]; then exit 1; fi
              sleep 15
            done
            echo "::endgroup::"
          done
        env:
          # GitHub-hosted runners share IP ranges across millions of jobs/day, and
          # huggingface.co throttles/blocks anonymous requests from those ranges far
          # more aggressively than from a normal residential IP — the mirror fallback
          # hit the exact same wall. An authenticated request gets a much higher rate
          # limit; set HF_TOKEN as a repo secret (Settings > Secrets and variables >
          # Actions) with a read-only token from https://huggingface.co/settings/tokens.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
