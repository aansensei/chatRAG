name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # easyocr pulls in opencv-python (GUI build), which needs libGL on a
      # headless runner — without it, `import cv2` fails at test-collection time.
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r backend/requirements.txt
      # tests/*.py are standalone scripts (sys.exit-based), not pytest modules —
      # run each directly rather than via `pytest`, which fails on collection.
      - run: |
          for f in backend/tests/test_*.py; do
            echo "::group::$f"
            PYTHONPATH=backend python "$f" || exit 1
            echo "::endgroup::"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
