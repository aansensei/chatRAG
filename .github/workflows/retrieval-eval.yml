name: Retrieval eval

# Runs against the real Supabase knowledge base (needs the actual golden-set
# documents already ingested), so it's separate from ci.yml: it doesn't block
# every push/PR, only a nightly schedule plus manual runs. LLM-dependent steps
# (rewrite, HyDE, multi-query) are skipped server-side when no api_key/model is
# passed, so no LLM provider key is required — this only exercises retrieval.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC = 02:00 ICT

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r backend/requirements.txt
      # BAAI/bge-m3 (the production embedding model) is a multilingual model —
      # much larger than the all-MiniLM-L6-v2 the unit tests use, and must match
      # whatever dimension the real KB was embedded with, or every query returns
      # nonsense against the pgvector index.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3
      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/docs -o /dev/null && exit 0
            sleep 2
          done
          echo "Backend failed to start"; cat /tmp/backend.log; exit 1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JWT_SECRET_KEY: ci-only-throwaway-secret-not-used-in-production
          ADMIN_EMAIL: ci-eval@chatrag.local
          ADMIN_PASSWORD: ci-eval-throwaway-password
          REDIS_URL: redis://localhost:6379/0
          EMBEDDING_MODEL: BAAI/bge-m3
          HF_HUB_OFFLINE: "0"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Run retrieval eval
        working-directory: backend
        run: python scripts/eval_retrieval.py
        env:
          JWT_SECRET_KEY: ci-only-throwaway-secret-not-used-in-production
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
